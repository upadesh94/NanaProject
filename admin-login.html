<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Pana Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-dark: #1e40af;
    --primary-glow: rgba(37, 99, 235, 0.28);
    --primary-light: #eff6ff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: rgba(226, 232, 240, 0.85);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    width: 100vw;
    background-color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(191, 219, 254, 0.65) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(187, 247, 208, 0.55) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(233, 213, 255, 0.6) 0px, transparent 50%),
      radial-gradient(at 0% 100%, rgba(254, 240, 138, 0.45) 0px, transparent 50%),
      radial-gradient(at 50% 50%, rgba(224, 242, 254, 0.5) 0px, transparent 50%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    color: var(--text-main);
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient floating orbs for rich depth */
  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
    animation: floatOrb 12s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 380px;
    height: 380px;
    background: linear-gradient(135deg, #60a5fa, #38bdf8);
    top: -100px;
    left: -80px;
  }
  .orb-2 {
    width: 360px;
    height: 360px;
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    bottom: -80px;
    right: -60px;
    animation-duration: 15s;
    animation-delay: -4s;
  }
  .orb-3 {
    width: 300px;
    height: 300px;
    background: linear-gradient(135deg, #86efac, #67e8f9);
    top: 50%;
    right: 15%;
    animation-duration: 18s;
    animation-delay: -7s;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 40px) scale(1.08); }
    100% { transform: translate(-20px, 20px) scale(0.95); }
  }

  .login-container {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 10;
    animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEntrance {
    0% {
      opacity: 0;
      transform: translateY(20px) scale(0.97);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .login-card {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 28px;
    padding: 44px 40px;
    box-shadow: 
      0 25px 60px -15px rgba(30, 58, 138, 0.14),
      0 10px 25px -5px rgba(15, 23, 42, 0.05),
      0 0 0 1px rgba(226, 232, 240, 0.6),
      inset 0 1px 1px rgba(255, 255, 255, 1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .badge-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    color: var(--primary);
    border: 1px solid #bfdbfe;
    padding: 7px 16px;
    border-radius: 9999px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.4px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
    transition: all 0.25s ease;
  }

  .brand-badge:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.18);
  }

  .badge-icon-box {
    width: 20px;
    height: 20px;
    background: var(--primary);
    color: white;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .badge-icon-box svg {
    width: 12px;
    height: 12px;
  }

  .header-area {
    text-align: center;
  }

  .header-area h1 {
    font-size: 1.95rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.03em;
    line-height: 1.2;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-area p {
    color: var(--text-muted);
    font-size: 0.94rem;
    line-height: 1.55;
    margin-bottom: 30px;
  }

  .form-group {
    margin-bottom: 20px;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 7px;
    letter-spacing: 0.1px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 15px;
    width: 19px;
    height: 19px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .form-input {
    width: 100%;
    padding: 14px 44px 14px 44px;
    background: rgba(248, 250, 252, 0.85);
    border: 1.5px solid var(--border-color);
    border-radius: 14px;
    font-size: 0.96rem;
    color: var(--text-main);
    outline: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
  }

  .form-input::placeholder {
    color: #94a3b8;
    font-weight: 400;
  }

  .form-input:hover {
    border-color: #cbd5e1;
    background: #ffffff;
  }

  .form-input:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 
      0 0 0 4px var(--primary-glow),
      0 2px 8px rgba(37, 99, 235, 0.08);
  }

  .input-wrapper:focus-within .input-icon {
    color: var(--primary);
    transform: scale(1.05);
  }

  .toggle-password-btn {
    position: absolute;
    right: 14px;
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: color 0.2s ease, background-color 0.2s ease;
  }

  .toggle-password-btn:hover {
    color: #334155;
    background-color: #f1f5f9;
  }

  .toggle-password-btn svg {
    width: 18px;
    height: 18px;
  }

  .submit-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 
      0 4px 15px var(--primary-glow),
      inset 0 1px 1px rgba(255, 255, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    position: relative;
    overflow: hidden;
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.6s ease;
  }

  .submit-btn:hover {
    background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    transform: translateY(-2px);
    box-shadow: 
      0 8px 25px rgba(37, 99, 235, 0.42),
      inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .submit-btn:hover::before {
    left: 100%;
  }

  .submit-btn:active {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
  }

  .submit-btn:disabled {
    opacity: 0.72;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .spinner {
    width: 19px;
    height: 19px;
    border: 2.5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    display: none;
  }

  .submit-btn.loading .spinner {
    display: inline-block;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #login-error {
    margin-top: 18px;
    padding: 13px 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    color: #dc2626;
    font-size: 0.88rem;
    font-weight: 600;
    display: none;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.08);
    animation: errorEntrance 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #login-error:not(:empty) {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  @keyframes errorEntrance {
    0% { opacity: 0; transform: translateY(-6px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .footer-meta {
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 500;
    color: #64748b;
  }

  .footer-meta svg {
    width: 15px;
    height: 15px;
    color: #10b981;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }
    .login-card {
      padding: 34px 24px;
      border-radius: 22px;
    }
    .header-area h1 {
      font-size: 1.7rem;
    }
  }
</style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="badge-wrapper">
        <div class="brand-badge">
          <div class="badge-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
          </div>
          Pana Calculator Admin
        </div>
      </div>

      <div class="header-area">
        <h1>Admin Sign In</h1>
        <p>Enter your authorized credentials to access the calculator and transactions.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="login-email" class="form-input" placeholder="admin@example.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" id="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-off-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div id="login-error"></div>
    </div>
    <div class="footer-meta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Protected with Firebase Authentication
    </div>
  </div>

  <script type="module">
    import './firebase-auth.mjs';
    
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    // Password visibility toggle
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.style.display = isPassword ? 'none' : 'block';
        eyeOffIcon.style.display = isPassword ? 'block' : 'none';
      });
    }

    // If already logged in, redirect to main dashboard
    if (window.firebaseOnAuthStateChanged) {
      window.firebaseOnAuthStateChanged((user) => {
        if (user) {
          window.location.replace('/');
        }
      });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      btnText.textContent = 'Signing in...';

      try {
        await window.firebaseSignIn(email, password);
        // On success, firebaseOnAuthStateChanged will redirect to '/'
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.textContent = 'Sign In';

        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          loginError.textContent = 'Incorrect email or password. Please try again.';
        } else if (err.code === 'auth/too-many-requests') {
          loginError.textContent = 'Too many failed login attempts. Please try again later.';
        } else {
          loginError.textContent = err.message || 'An error occurred during sign in.';
        }
      }
    });
  </script>
</body>
</html>
