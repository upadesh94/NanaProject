<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Pana Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e8f5e9 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
  }
  .login-card {
    background: #ffffff;
    padding: 44px 40px;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-sizing: border-box;
  }
  .login-card h2 { margin-top: 0; margin-bottom: 6px; color: #1e293b; font-size: 1.9rem; font-weight: 700; }
  .login-card p.subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 28px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 13px 16px; margin-bottom: 14px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; color: #1e293b; font-size: 1rem; outline: none; transition: all 0.25s ease; }
  .login-card input::placeholder { color: #94a3b8; }
  .login-card input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08); }
  .login-card button { width: 100%; box-sizing: border-box; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.25s ease; letter-spacing: 0.4px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25); margin-top: 4px; }
  .login-card button:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); }
  .login-card button:active { transform: translateY(1px); box-shadow: none; }
  #login-error { color: #ef4444; margin-top: 14px; font-size: 0.9rem; font-weight: 500; min-height: 1.4em; background: #fef2f2; border-radius: 8px; padding: 8px 12px; display: none; }
  #login-error:not(:empty) { display: block; }
</style>
</head>
<body>
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account to continue</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email Address" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <div id="login-error"></div>
  </div>

  <script type="module">
    import '/firebase-auth.mjs';
    
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');

    // If already logged in, redirect to main page
    window.firebaseOnAuthStateChanged((user) => {
      if (user) {
        window.location.href = '/';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const submitBtn = loginForm.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await window.firebaseSignIn(email, password);
        // On success, firebaseOnAuthStateChanged will fire and redirect
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          loginError.textContent = 'Incorrect email or password. Please try again.';
        } else if (err.code === 'auth/too-many-requests') {
          loginError.textContent = 'Too many failed login attempts. Please try again later.';
        } else {
          loginError.textContent = err.message || 'An error occurred during sign in.';
        }
      }
    });
  </script>
</body>
</html>
