<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Pana Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-glow: rgba(37, 99, 235, 0.25);
    --bg-gradient: radial-gradient(at 0% 0%, rgba(224, 242, 254, 0.8) 0px, transparent 50%),
                    radial-gradient(at 100% 0%, rgba(220, 252, 231, 0.6) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(243, 232, 255, 0.7) 0px, transparent 50%),
                    radial-gradient(at 0% 100%, rgba(254, 243, 199, 0.5) 0px, transparent 50%),
                    #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.95);
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    width: 100vw;
    background: var(--bg-gradient);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: var(--text-main);
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #eff6ff;
    color: var(--primary);
    border: 1px solid #bfdbfe;
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-bottom: 20px;
  }

  .brand-badge svg {
    width: 15px;
    height: 15px;
  }

  .header-area h1 {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .header-area p {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 0.86rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper svg {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.2s ease;
  }

  .form-input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
  }

  .form-input:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 4px var(--primary-glow);
  }

  .form-input:focus + svg,
  .input-wrapper:focus-within svg {
    color: var(--primary);
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 14px var(--primary-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }

  .submit-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }

  .submit-btn:active {
    transform: translateY(1px);
    box-shadow: none;
  }

  .submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .submit-btn.loading .spinner {
    display: inline-block;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #login-error {
    margin-top: 16px;
    padding: 12px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    color: #dc2626;
    font-size: 0.88rem;
    font-weight: 500;
    display: none;
    animation: shake 0.3s ease;
  }

  #login-error:not(:empty) {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .footer-meta {
    margin-top: 24px;
    text-align: center;
    font-size: 0.82rem;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div style="text-align: center;">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          Pana Calculator Admin
        </div>
      </div>

      <div class="header-area" style="text-align: center;">
        <h1>Admin Sign In</h1>
        <p>Enter your authorized credentials to access the calculator and transactions.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="login-email" class="form-input" placeholder="admin@example.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <div id="login-error"></div>
    </div>
    <div class="footer-meta">
      Protected with Firebase Authentication
    </div>
  </div>

  <script type="module">
    import './firebase-auth.mjs';
    
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');

    // If already logged in, redirect to main dashboard
    if (window.firebaseOnAuthStateChanged) {
      window.firebaseOnAuthStateChanged((user) => {
        if (user) {
          window.location.replace('/');
        }
      });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      btnText.textContent = 'Signing in...';

      try {
        await window.firebaseSignIn(email, password);
        // On success, firebaseOnAuthStateChanged will redirect to '/'
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.textContent = 'Sign In';

        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          loginError.textContent = 'Incorrect email or password. Please try again.';
        } else if (err.code === 'auth/too-many-requests') {
          loginError.textContent = 'Too many failed login attempts. Please try again later.';
        } else {
          loginError.textContent = err.message || 'An error occurred during sign in.';
        }
      }
    });
  </script>
</body>
</html>
